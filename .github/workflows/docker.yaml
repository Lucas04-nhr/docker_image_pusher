name: Docker

on:
  workflow_dispatch:
    inputs:
      runner_count:
        description: "Number of parallel runners"
        required: true
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "8"
  schedule:
    - cron: "0 4 * * 1"
      timezone: "Europe/Copenhagen"
  push:
    branches: [main]

env:
  ALIYUN_REGISTRY: "${{ vars.ALIYUN_REGISTRY }}"
  ALIYUN_NAMESPACE: "${{ vars.ALIYUN_NAMESPACE }}"
  ALIYUN_REGISTRY_USER: "${{ vars.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  prepare:
    name: Prepare runner shards
    runs-on: ubuntu-latest
    outputs:
      runner_count: ${{ steps.shards.outputs.runner_count }}
      shards: ${{ steps.shards.outputs.shards }}
      sync_plan: ${{ steps.images.outputs.sync_plan }}
      has_images: ${{ steps.images.outputs.has_images }}
      update_count: ${{ steps.images.outputs.update_count }}
      update_summary: ${{ steps.images.outputs.update_summary }}
      update_report: ${{ steps.images.outputs.update_report }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Aliyun
        run: printf '%s' "$ALIYUN_REGISTRY_PASSWORD" | docker login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub credentials are not set, using the anonymous rate limit."
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Select images to sync
        id: images
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          import uuid
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          def entries(text):
              return {
                  number: " ".join(line.split())
                  for number, line in enumerate(text.splitlines(), 1)
                  if line.strip() and not line.lstrip().startswith("#")
              }

          def split_image(image):
              """Return (namespace, image name, name:tag)."""
              parts = image.split("@")[0].split("/")
              namespace = parts[-2] if len(parts) in (2, 3) else ""
              return namespace, parts[-1].split(":")[0], parts[-1]

          def inspect_raw(ref):
              result = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", "--raw", ref],
                  capture_output=True, text=True, timeout=60, check=True,
              )
              return json.loads(result.stdout)

          def config_digest(ref, platform):
              """Config digest for one platform. It survives a re-push, unlike the manifest digest."""
              manifest = inspect_raw(ref)
              if "manifests" in manifest:
                  os_name, arch, *variant = platform.split("/")
                  for candidate in manifest["manifests"]:
                      wanted = candidate.get("platform", {})
                      if (wanted.get("os"), wanted.get("architecture")) == (os_name, arch) and (
                          not variant or wanted.get("variant") == variant[0]
                      ):
                          bare = ref.split("@")[0]
                          if ":" in bare.rsplit("/", 1)[-1]:
                              bare = bare.rsplit(":", 1)[0]
                          manifest = inspect_raw(f"{bare}@{candidate['digest']}")
                          break
                  else:
                      raise LookupError(f"no manifest for {platform}")
              return manifest["config"]["digest"]

          current = entries(Path("images.txt").read_text() if Path("images.txt").exists() else "")

          namespaces = {}
          duplicates = set()
          for entry in current.values():
              namespace, name, _ = split_image(entry.split()[-1])
              if namespaces.setdefault(name, namespace) != namespace:
                  duplicates.add(name)

          def platform_of(entry):
              match = re.search(r"--platform[ =](\S+)", entry)
              return match.group(1) if match else None

          def target_name(entry):
              """Name and tag of the mirrored image inside the Aliyun namespace."""
              namespace, name, name_tag = split_image(entry.split()[-1])
              platform = platform_of(entry)
              prefix = platform.replace("/", "_") + "_" if platform else ""
              if name in duplicates and namespace:
                  prefix += f"{namespace}_"
              return f"{prefix}{name_tag}"

          def needs_sync(entry):
              image = entry.split()[-1]
              platform = platform_of(entry) or "linux/amd64"
              target = f"{os.environ['ALIYUN_REGISTRY']}/{os.environ['ALIYUN_NAMESPACE']}/{target_name(entry)}"
              try:
                  source_digest = config_digest(image, platform)
              except Exception as error:
                  print(f"sync   {entry}: source not comparable ({type(error).__name__})")
                  return True, None
              try:
                  target_digest = config_digest(target, platform)
              except Exception as error:
                  print(f"sync   {entry}: target not comparable ({type(error).__name__})")
                  return True, (entry, None, None)
              if source_digest != target_digest:
                  print(f"sync   {entry}: {target_digest} -> {source_digest}")
                  return True, (entry, target_digest[7:19], source_digest[7:19])
              print(f"latest {entry}")
              return False, None

          # Manual runs stay a full re-sync, which also repairs a target that looks up to date.
          updates = []
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              selected = list(current)
          else:
              with ThreadPoolExecutor(max_workers=8) as pool:
                  results = list(pool.map(needs_sync, current.values()))
              selected = [number for number, (flag, _) in zip(current, results) if flag]
              updates = [update for _, update in results if update]

          # The registry and namespace stay out of the plan: GitHub drops any job output containing a secret.
          plan = [
              {
                  "line": number,
                  "entry": current[number],
                  "image": current[number].split()[-1],
                  "target_name": target_name(current[number]),
              }
              for number in selected
          ]

          missing = "missing or unreadable in the target registry"
          # Annotations do not render Markdown, so only the push report uses code formatting.
          report = "\n".join(
              f"- `{entry}`: `{old}` -> `{new}`" if old else f"- `{entry}`: {missing}"
              for entry, old, new in updates
          )
          if updates:
              # One annotation per run, because GitHub shows at most 10 notices per step.
              message = "\n".join(
                  f"{entry}: {old} -> {new}" if old else f"{entry}: {missing}"
                  for entry, old, new in updates
              )
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice file=images.txt,title=Image updates detected: {len(updates)}::{message}")

          # Card text for the push, e.g. "8 updated, 2 missing". The push body has the details.
          changed = sum(1 for _, old, _ in updates if old)
          counts = (
              (changed, "updated"),
              (len(updates) - changed, "missing"),
              (len(selected) - len(updates), "not compared"),
          )
          summary = ", ".join(f"{count} {label}" for count, label in counts if count) or "0 updated"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              delimiter = f"REPORT_{uuid.uuid4().hex}"
              output.write(f"update_count={len(updates)}\n")
              output.write(f"update_summary={summary}\n")
              output.write(f"update_report<<{delimiter}\n{report}\n{delimiter}\n")
              output.write(f"sync_plan={json.dumps(plan)}\n")
              output.write(f"has_images={'true' if plan else 'false'}\n")
          print(f"Selected {len(selected)} image entries for synchronization.")

      - name: Generate runner shards
        id: shards
        env:
          REQUESTED_RUNNER_COUNT: ${{ github.event.inputs.runner_count }}
        run: |
          runner_count="${REQUESTED_RUNNER_COUNT:-4}"
          case "$runner_count" in
            1) shards='[0]' ;;
            2) shards='[0,1]' ;;
            4) shards='[0,1,2,3]' ;;
            8) shards='[0,1,2,3,4,5,6,7]' ;;
            *)
              echo "Unsupported runner count: $runner_count" >&2
              exit 1
              ;;
          esac

          echo "runner_count=$runner_count" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  build:
    name: Pull (shard ${{ matrix.shard }})
    needs: prepare
    if: needs.prepare.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    env:
      SYNC_PLAN: ${{ needs.prepare.outputs.sync_plan }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: ${{ needs.prepare.outputs.runner_count }}
    steps:
      - name: Before freeing up disk space
        run: |
          echo "Before freeing up disk space"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      # 增加可用磁盘空间
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 512
          remove-dotnet: "true"
          remove-haskell: "true"
          # 如果空间还是不够用，可以把以下开启，清理出更多空间
          remove-android: "true"
          remove-codeql: "true"
          build-mount-path: "/var/lib/docker/"

      - name: Restart docker
        run: sudo service docker restart

      - name: Initial Docker Cleanup
        run: |
          echo "Initial Docker Cleanup"
          docker system prune -af --volumes
          docker image prune -a -f
          docker builder prune -a -f

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub credentials are not set, using the anonymous rate limit."
            exit 0
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and push image Aliyun
        run: |
          warn_skipped_image() {
              local message="$1"
              message="${message//'%'/'%25'}"
              message="${message//$'\r'/'%0D'}"
              message="${message//$'\n'/'%0A'}"
              printf '::warning file=images.txt,line=%s,title=Image skipped::%s\n' "$line_number" "$message"
          }

          docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
          # 同步计划（含目标镜像名）由 prepare job 统一生成，这里只取属于当前分片的条目
          jq -r --argjson count "$SHARD_COUNT" --argjson index "$SHARD_INDEX" \
              'to_entries[] | select(.key % $count == $index) | .value | [.line, .entry, .image, .target_name] | @tsv' \
              <<< "$SYNC_PLAN" > "$RUNNER_TEMP/shard.tsv"

          while IFS=$'\t' read -r line_number line image target_name; do
              echo "shard $SHARD_INDEX/$SHARD_COUNT processing: $line"

              echo "docker pull $line"
              if pull_output=$(docker pull $line 2>&1); then
                  printf '%s\n' "$pull_output"
              else
                  warn_skipped_image "Skipping $line: docker pull failed. $pull_output"
                  continue
              fi
              new_image="$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$target_name"
              echo "docker tag $image $new_image"
              if tag_output=$(docker tag "$image" "$new_image" 2>&1); then
                  printf '%s\n' "$tag_output"
              else
                  warn_skipped_image "Skipping $image: docker tag to $new_image failed. $tag_output"
                  docker rmi "$image" || true
                  continue
              fi
              echo "docker push $new_image"
              docker push $new_image
              echo "开始清理磁盘空间"
              echo "=============================================================================="
              df -hT
              echo "=============================================================================="
              docker rmi $image
              docker rmi $new_image
              # 更激进的清理策略
              docker image prune -f
              docker builder prune -af
              docker system prune -f --volumes
              echo "磁盘空间清理完毕"
              echo "=============================================================================="
              df -hT
              echo "=============================================================================="

          done < "$RUNNER_TEMP/shard.tsv"

  notify:
    name: Notify image updates
    needs: [prepare, build]
    # Manual runs are a full re-sync without detection, so they have nothing to report.
    if: always() && needs.prepare.outputs.update_count != '' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Send ServerChan push
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          UPDATE_COUNT: ${{ needs.prepare.outputs.update_count }}
          UPDATE_SUMMARY: ${{ needs.prepare.outputs.update_summary }}
          UPDATE_REPORT: ${{ needs.prepare.outputs.update_report }}
          HAS_IMAGES: ${{ needs.prepare.outputs.has_images }}
          BUILD_RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SERVERCHAN_SENDKEY" ]; then
            echo "::warning title=Update push skipped::Set the SERVERCHAN_SENDKEY secret to enable update pushes."
            exit 0
          fi
          if [[ ! "$SERVERCHAN_SENDKEY" =~ ^sctp([0-9]+)t ]]; then
            echo "::error title=Update push failed::SERVERCHAN_SENDKEY is not a ServerChan3 key (sctp...)."
            exit 1
          fi
          uid="${BASH_REMATCH[1]}"
          echo "::add-mask::$uid"

          if [ "$UPDATE_COUNT" != "0" ]; then
            title="Image updates detected: $UPDATE_COUNT"
            desp="$UPDATE_REPORT

          Sync result: \`$BUILD_RESULT\`

          Check the [workflow run]($RUN_URL) for detailed logs."
          elif [ "$HAS_IMAGES" = "true" ]; then
            # Entries whose source could not be inspected are still synced, but do not count as updates.
            title="No image updates detected"
            desp="Some source images could not be compared, so they were synced anyway.

          Sync result: \`$BUILD_RESULT\`

          Check the [workflow run]($RUN_URL) for detailed logs."
          else
            title="No image updates detected"
            desp="All images are up to date.

          Check the [workflow run]($RUN_URL) for detailed logs."
          fi

          response=$(curl -sS --fail-with-body --retry 3 \
            --data-urlencode "title=$title" \
            --data-urlencode "desp=$desp" \
            --data-urlencode "short=$UPDATE_SUMMARY" \
            --data-urlencode "tags=GitHub" \
            "https://$uid.push.ft07.com/send/$SERVERCHAN_SENDKEY.send")
          # The response may carry a read key and the logs are public, so print only the status.
          jq -r '"code=\(.code // "none") message=\(.message // "")"' <<< "$response"
          jq -e '(.code // 0) == 0' <<< "$response" > /dev/null
